name: Build HH500V ImmortalWrt
on:
  workflow_dispatch:

env:
  REPO: https://github.com/immortalwrt/immortalwrt

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get clean

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk \
            gettext git libelf-dev libncurses5-dev libssl-dev python3 python3-distutils \
            rsync swig unzip zlib1g-dev zip binutils bzip2 perl diffstat patch \
            device-tree-compiler qemu-utils

      - name: Clone 24.10.6
        run: |
          set -e
          git clone --filter=blob:none --no-checkout https://github.com/immortalwrt/immortalwrt openwrt || \
            git clone --no-checkout https://github.com/immortalwrt/immortalwrt openwrt
          git -C openwrt checkout cf234f8de6d5
          git -C openwrt log -1 --oneline

      - name: Backport HH500V device
        run: |
          set -e
          cd openwrt
          git config user.email ci@local
          git config user.name ci
          for sha in ac8b5526bc 12fd85eb79 30378ffea4; do
            echo "== $sha"
            git fetch --depth 50 https://github.com/openwrt/openwrt.git $sha || \
              git fetch https://github.com/openwrt/openwrt.git $sha
            git cherry-pick -3 --no-commit FETCH_HEAD
            git commit -m "backport $sha" || true
          done
          grep -n tcl_linkhub-hh500v target/linux/qualcommax/image/ipq807x.mk

      - name: MHI 6.6 backport patch
        run: |
          mkdir -p openwrt/target/linux/generic/backport-6.6
          cp patches/706-*.patch openwrt/target/linux/generic/backport-6.6/
          ls openwrt/target/linux/generic/backport-6.6/

      - name: Custom packages
        run: |
          mkdir -p openwrt/package/custom
          cp -r custom-packages/* openwrt/package/custom/
          find openwrt/package/custom -name Makefile

      - name: Feeds
        run: |
          set -e
          cd openwrt
          {
            echo "src-git packages https://github.com/immortalwrt/packages.git;openwrt-24.10"
            echo "src-git luci https://github.com/immortalwrt/luci.git;openwrt-24.10"
            echo "src-git routing https://github.com/immortalwrt/routing.git;openwrt-24.10"
            echo "src-git telephony https://github.com/immortalwrt/telephony.git;openwrt-24.10"
            echo "src-git qmodem https://github.com/FUjr/QModem.git;main"
            echo "src-git small https://github.com/kenzok8/small-package.git;main"
            echo "src-git kenzok8 https://github.com/kenzok8/openwrt-packages.git;master"
          } > feeds.conf.default
          cat feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a || true

      - name: Configure
        run: |
          set -e
          cd openwrt
          cp ../configs/hh500v-24.10.config .config
          make defconfig
          grep -E "CONFIG_TARGET_qualcommax" .config | head -5

      - name: Download
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s

      - name: Build
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Collect
        run: |
          mkdir -p out
          find openwrt/bin/targets -name '*hh500v*' -exec cp -v {} out/ \; || true
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: hh500v-24.10.6-full
          path: out/
          if-no-files-found: error
