name: Build HH500V ImmortalWrt (24.10.6, ported)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get clean

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk \
            gettext git libelf-dev libncurses5-dev libssl-dev python3 python3-distutils \
            rsync swig unzip zlib1g-dev zip binutils bzip2 perl diffstat patch \
            device-tree-compiler qemu-utils

      - name: Clone 24.10.6
        run: |
          set -e
          git clone --filter=blob:none --no-checkout https://github.com/immortalwrt/immortalwrt openwrt || \
            git clone --no-checkout https://github.com/immortalwrt/immortalwrt openwrt
          git -C openwrt checkout cf234f8de6d5
          git -C openwrt log -1 --oneline

      - name: Port HH500V to 24.10
        run: |
          set -e
          python3 port/apply-port.py openwrt
          grep -n "tcl_linkhub-hh500v" openwrt/target/linux/qualcommax/image/ipq807x.mk
          grep -c "tcl,linkhub-hh500v" openwrt/target/linux/qualcommax/ipq807x/base-files/etc/board.d/02_network || true

      - name: MHI into kernel (24.10 has no kmod-mhi packages)
        run: |
          python3 - <<'PY'
          p = "openwrt/target/linux/qualcommax/image/ipq807x.mk"
          s = open(p).read()
          old = ("DEVICE_PACKAGES := ipq-wifi-tcl_linkhub-hh500v kmod-mhi-pci-generic \\\n"
                 "\t\tkmod-mhi-wwan-ctrl kmod-mhi-wwan-mbim")
          new = "DEVICE_PACKAGES := ipq-wifi-tcl_linkhub-hh500v"
          if old in s:
              s = s.replace(old, new)
              open(p, "w").write(s)
              print("DEVICE_PACKAGES: kmod-mhi removed")
          else:
              print("WARNING: DEVICE_PACKAGES pattern not found")
          PY
          cat >> openwrt/target/linux/qualcommax/config-6.6 <<'EOF'
          CONFIG_WWAN=y
          CONFIG_MHI_BUS=y
          CONFIG_MHI_BUS_PCI_GENERIC=y
          CONFIG_MHI_WWAN_CTRL=y
          CONFIG_MHI_WWAN_MBIM=y
          EOF
          echo "=== config-6.6 tail ==="
          tail -6 openwrt/target/linux/qualcommax/config-6.6
          echo "=== device packages ==="
          grep -A2 "DEVICE_PACKAGES := ipq-wifi-tcl" openwrt/target/linux/qualcommax/image/ipq807x.mk

      - name: MHI 6.6 backport patch
        run: |
          mkdir -p openwrt/target/linux/generic/backport-6.6
          cp patches/706-*.patch openwrt/target/linux/generic/backport-6.6/
          ls openwrt/target/linux/generic/backport-6.6/

      - name: Custom packages
        run: |
          mkdir -p openwrt/package/custom
          cp -r custom-packages/* openwrt/package/custom/
          find openwrt/package/custom -name Makefile

      - name: Feeds
        run: |
          cd openwrt
          {
            echo "src-git packages https://github.com/immortalwrt/packages.git;openwrt-24.10"
            echo "src-git luci https://github.com/immortalwrt/luci.git;openwrt-24.10"
            echo "src-git routing https://github.com/immortalwrt/routing.git;openwrt-24.10"
            echo "src-git telephony https://github.com/immortalwrt/telephony.git;openwrt-24.10"
            echo "src-git qmodem https://github.com/FUjr/QModem.git;main"
            echo "src-git small https://github.com/kenzok8/small-package.git;main"
          } > feeds.conf.default
          cat feeds.conf.default
          ./scripts/feeds update -a || { echo "retry update"; sleep 10; ./scripts/feeds update -a; } || true
          ./scripts/feeds install -a || true

      - name: Configure
        run: |
          cd openwrt
          cp ../configs/hh500v-24.10.config .config
          make defconfig || { echo "!! defconfig failed"; exit 1; }
          echo "=== device ==="
          grep -E "CONFIG_TARGET_qualcommax_ipq807x_DEVICE_tcl_linkhub-hh500v" .config || \
            { echo "!! device not selected"; exit 1; }
          echo "=== MHI in kernel config ==="
          grep -E "CONFIG_MHI" .config || echo "(未生效，将导致 5G 不可用)"

      - name: Download
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s

      - name: Build
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Collect
        run: |
          mkdir -p out
          find openwrt/bin/targets -name '*hh500v*' -exec cp -v {} out/ \; || true
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: hh500v-2410-port
          path: out/
          if-no-files-found: error
